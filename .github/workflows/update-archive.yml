name: Sync archive

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # so upload dates come from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull Are.na / Pinterest / Cosmos / uploads
        env:
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
        run: node scripts/build-archive.mjs

      # Saving archive.json to main makes GitHub Pages republish the site
      # automatically (Settings → Pages → Deploy from a branch → main / root).
      - name: Save archive.json back to the repo
        run: |
          git config user.name  "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet || git commit -m "Sync archive [skip ci]"
          git push
